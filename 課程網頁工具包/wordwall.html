<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI 學習期待文字牆</title><link rel="stylesheet" href="wordwall.css" />
</head>
<body>
  <header><a href="index.html">← 回簡報</a><div><h1>我們希望 AI 幫上什麼忙？</h1><p>問卷第 12、13 題·離線文字牆</p></div><button id="fullscreen">全螢幕</button></header>
  <main>
    <section class="editor" id="editor">
      <div class="privacy"><b>⛨ 離線使用</b><span>內容只在這個瀏覽器頁面處理，不會上傳。投影前請檢查是否含姓名或可識別資訊。</span></div>
      <div class="inputs">
        <label><span><b>第 12 題</b>希望完成的 AI 成果</span><textarea id="q12" placeholder="從 Google 試算表複製這一欄，直接貼在這裡……"></textarea></label>
        <label><span><b>第 13 題</b>其他需求或顧慮</span><textarea id="q13" placeholder="每一行會變成一張便利貼……"></textarea></label>
      </div>
      <div class="actions"><button id="sample" class="ghost">載入範例</button><button id="clear" class="ghost">清除</button><button id="build" class="primary">生成文字牆</button></div>
    </section>
    <section class="wall" id="wall" hidden>
      <div class="wall-top"><div class="legend">兩題分區顯示，方便逐題討論</div><div><button id="shuffle">重新排列</button><button id="edit">返回編輯</button><button id="print">列印／儲存 PDF</button></div></div>
      <div class="wall-columns">
        <section class="question-column hope-column">
          <div class="column-heading"><div><span class="question-tag">QUESTION 12</span><h2>我最希望用 AI 協助完成……</h2></div><span id="q12Count" class="count">0 則</span></div>
          <div id="q12Notes" class="notes"></div>
        </section>
        <section class="question-column concern-column">
          <div class="column-heading"><div><span class="question-tag">QUESTION 13</span><h2>我還希望學到、討論或獲得協助的是……</h2></div><span id="q13Count" class="count">0 則</span></div>
          <div id="q13Notes" class="notes"></div>
        </section>
      </div>
      <div id="empty" class="empty" hidden>還沒有可顯示的回答。</div>
    </section>
  </main>
  <script src="wordwall.js"></script>
</body></html>
